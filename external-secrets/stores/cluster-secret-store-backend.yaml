apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "backend"        # doit correspondre au moteur KV activé
      version: "v2"          # KV v2
      auth:
        kubernetes:
          mountPath: "kubernetes"  # chemin de l'auth method dans Vault
          role: "eso-backend"      # rôle Vault créé en Partie 3
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
