apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-database
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "database"       # moteur database (dynamic secrets)
      version: "v1"          # le moteur database n'est pas KV v2
      auth:
        kubernetes:
          mountPath: "kubernetes"
          role: "eso-database"
          serviceAccountRef:
            name: "external-secrets"
            namespace: "external-secrets"
