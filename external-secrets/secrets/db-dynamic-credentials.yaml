apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-dynamic-credentials
  namespace: backend
spec:
  refreshInterval: 50s   # inférieur au TTL Vault (1m) pour toujours avoir un token valide
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-database
  target:
    name: db-dynamic-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
  - secretKey: username
    remoteRef:
      key: creds/app       # chemin dans le moteur database : database/creds/app
      property: username
  - secretKey: password
    remoteRef:
      key: creds/app
      property: password
