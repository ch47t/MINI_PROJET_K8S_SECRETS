# Secret db-credentials (statique depuis Vault KV)
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: backend
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: db-credentials      # chemin dans Vault : backend/db-credentials
      property: password
  - secretKey: username
    remoteRef:
      key: db-credentials
      property: username
---
# Secret jwt-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: jwt-key
  namespace: backend
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: jwt-key
    creationPolicy: Owner
  data:
  - secretKey: secret
    remoteRef:
      key: jwt-key
      property: secret
---
# Secret external-api-key
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: external-api-key
  namespace: backend
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: external-api-key
    creationPolicy: Owner
  data:
  - secretKey: key
    remoteRef:
      key: external-api-key
      property: key
