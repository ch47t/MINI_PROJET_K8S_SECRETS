apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: database
spec:
  refreshInterval: 60s
  secretStoreRef:
    kind: ClusterSecretStore
    name: vault-backend
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
  - secretKey: password
    remoteRef:
      key: database/db-credentials  # chemin complet dans le moteur KV
      property: password
  - secretKey: username
    remoteRef:
      key: database/db-credentials
      property: username
